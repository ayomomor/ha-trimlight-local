# A ready-made Trimlight dashboard.
# 1. Settings > Dashboards > Add dashboard > New dashboard from scratch. Title "Trimlight", tick "Add to sidebar".
# 2. Open it, then the pencil > three-dot menu > Raw configuration editor, replace everything with this file, and save.
# The entity IDs below are for a controller named Roofline; change "roofline" to your controller's name as Home Assistant shows it.
views:
  - title: "Trimlight"
    path: "trimlight"
    type: "sections"
    max_columns: 3
    sections:
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Lights"
          - type: "tile"
            entity: "light.roofline"
            features:
              - type: "light-brightness"
          - type: "entities"
            entities:
              - "select.roofline_mode"
              - "number.roofline_effect_speed"
              - "number.roofline_effect_length"
              - "switch.roofline_reverse_direction"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Patterns"
          - type: "custom:trimlight-pattern-card"
            entity: "light.roofline"
      - type: "grid"
        cards:
          - type: "heading"
            heading: "Schedules"
          - type: "calendar"
            entities:
              - "calendar.roofline_schedules"
            initial_view: "dayGridMonth"
          - type: "entities"
            title: "Daily schedule 1"
            entities:
              - "switch.roofline_daily_schedule_1"
              - "select.roofline_daily_schedule_1_effect"
              - "select.roofline_daily_schedule_1_repeat"
              - "time.roofline_daily_schedule_1_on"
              - "time.roofline_daily_schedule_1_off"
          - type: "entities"
            title: "Daily schedule 2"
            entities:
              - "switch.roofline_daily_schedule_2"
              - "select.roofline_daily_schedule_2_effect"
              - "select.roofline_daily_schedule_2_repeat"
              - "time.roofline_daily_schedule_2_on"
              - "time.roofline_daily_schedule_2_off"
